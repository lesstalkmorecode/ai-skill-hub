name: Validate AI Skill Hub
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m evals.validate
      - run: python -m unittest discover -s evals/tests -v
      - run: git diff --check
